name: Toffee API Output Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    env:
      API_URL: "https://entitlement-prod.services.toffeelive.com/toffee/BD/DK/web/playback/wHLVIJ4B7a1HdMSjaGLJ"

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl

      - name: Test API
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "        TOFFEE API TEST"
          echo "======================================"
          echo "Endpoint:"
          echo "$API_URL"
          echo

          echo "--------------------------------------"
          echo "1. HTTP RESPONSE"
          echo "--------------------------------------"

          curl -sS \
            -D response_headers.txt \
            -o response_body.txt \
            -w "HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\nTIME=%{time_total}s\n" \
            "$API_URL"

          echo
          echo "--------------------------------------"
          echo "2. RESPONSE HEADERS"
          echo "--------------------------------------"

          cat response_headers.txt

          echo
          echo "--------------------------------------"
          echo "3. RAW RESPONSE BODY"
          echo "--------------------------------------"

          cat response_body.txt

          echo
          echo "--------------------------------------"
          echo "4. JSON ANALYSIS"
          echo "--------------------------------------"

          if jq empty response_body.txt 2>/dev/null; then

            echo "Valid JSON: YES"
            echo

            echo "Top-level type:"
            jq -r 'type' response_body.txt

            echo
            echo "Top-level keys:"
            jq -r 'if type == "object" then keys[] else "(not an object)" end' response_body.txt

            echo
            echo "Field types:"

            jq -r '
              if type == "object"
              then
                to_entries[]
                | "\(.key) -> \(.value | type)"
              else
                "Response is not a JSON object"
              end
            ' response_body.txt

            echo
            echo "Pretty JSON:"
            jq '.' response_body.txt

          else

            echo "Valid JSON: NO"
            echo
            echo "Response appears to be plain text / HTML / empty."

          fi

          echo
          echo "--------------------------------------"
          echo "5. RESPONSE SUMMARY"
          echo "--------------------------------------"

          STATUS=$(awk -F= '/HTTP_STATUS=/{print $2}' <(curl -sS -o /dev/null \
            -w "HTTP_STATUS=%{http_code}\n" "$API_URL"))

          echo "HTTP Status: $STATUS"

          echo
          echo "API testing finished."
