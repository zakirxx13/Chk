name: Toffee Playback API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest

    env:
      API_URL: "https://entitlement-prod.services.toffeelive.com/toffee/BD/DK/web/playback/kK2aX5UBrjBfS2_RBcKf"

    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Call Playback API
        env:
          TOFFEE_TOKEN: ${{ secrets.TOFFEE_TOKEN }}
        run: |
          set +e

          echo "======================================"
          echo "       TOFFEE PLAYBACK API TEST"
          echo "======================================"

          curl -sS \
            -X POST \
            "$API_URL" \
            -D headers.txt \
            -o response.json \
            -w "\nHTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\nTIME=%{time_total}s\n" \
            -H "Authorization: Bearer $TOFFEE_TOKEN" \
            -H "Referer: https://toffeelive.com/" \
            -H "User-Agent: Mozilla/5.0" \
            -H "Content-Type: application/json"

          echo
          echo "======================================"
          echo "RESPONSE HEADERS"
          echo "======================================"

          cat headers.txt

          echo
          echo "======================================"
          echo "RAW RESPONSE"
          echo "======================================"

          cat response.json

          echo
          echo "======================================"
          echo "JSON ANALYSIS"
          echo "======================================"

          if jq empty response.json 2>/dev/null; then

            echo "Valid JSON: YES"
            echo

            echo "Top-level type:"
            jq -r 'type' response.json

            echo
            echo "Keys:"

            jq -r '
              if type == "object"
              then keys[]
              else "Not an object"
              end
            ' response.json

            echo
            echo "Field types:"

            jq -r '
              if type == "object"
              then
                to_entries[]
                | "\(.key) -> \(.value | type)"
              else
                "Not an object"
              end
            ' response.json

            echo
            echo "Pretty JSON:"
            jq '.' response.json

          else
            echo "Valid JSON: NO"
          fi
